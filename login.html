<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UMI | Login</title>

    <link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Common Authentication CSS -->
<link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/layout.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/buttons.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/forms.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/tables.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/modal.css') }}">

<!-- Page Specific CSS -->
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">

<!-- Responsive (Always Last) -->
<link rel="stylesheet" href="{{ url_for('static', filename='css/responsive.css') }}">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <main class="login-page">
        <section class="login-container">
            
            <div class="logo-section">
                <h1>Unified Medical Interface</h1>
                <p>Hospital Internal Management System</p>
            </div>

            <!-- Login Card -->
            <section class="login-card">

                <div class="login-header">
                    <h2>Welcome Back</h2>
                    <p>Please login to continue</p>
                </div>

                <form class="login-form" method="POST" action="{{ url_for('index') }}">

                    <div class="form-group">
                        <label for="employeeId">Employee ID</label>
                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Enter Employee ID"
                            autocomplete="username"
                            required>
                    </div>

                    <div class="form-group">

                        <label for="password">Password</label>

                        <div class="password-field">

                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Enter Password"
                                autocomplete="password"
                                required>

                            <button
                                type="button"
                                class="toggle-password"
                                aria-label="Show Password">
                                👁
                            </button>

                        </div>

                    </div>

                    <div class="form-options">

                        <label class="remember-me">
                            <input type="checkbox" name="remember">
                            <span>Remember Me</span>
                        </label>

                    </div>

                    <button type="submit" class="login-btn">
                        Login
                    </button>

                </form>

            </section>

            <!-- Footer -->
            <footer class="login-footer">
                <p>&copy; 2026 Unified Medical Interface (UMI)</p>
            </footer>

        </section>

    </main>

</body>

</html>
