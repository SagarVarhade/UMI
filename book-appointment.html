<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UMI | Book Appointment</title>
    <link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/layout.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/buttons.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/forms.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/tables.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/modal.css') }}">

<!-- Page Specific CSS -->
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">

<!-- Responsive (Always Last) -->
<link rel="stylesheet" href="{{ url_for('static', filename='css/responsive.css') }}">
</head>
<body>

<div class="page-container">

    <header class="page-header">

        <div class="page-title">
            <h1>Book Appointment</h1>
            <p>Register a new patient or book an appointment for an existing patient.</p>
        </div>

        <div class="page-actions">
            <a href="{{ url_for('nurse_dashboard') }}" class="secondary-btn">
                ← Back to Dashboard
            </a>
        </div>

    </header>

    <main class="form-container">

        <form id="appointmentForm">

            <!-- Search Section -->

            <section class="form-section">

                <h2>Patient Information</h2>

                <div class="form-row">

                    <div class="form-group flex-grow">

                        <label for="mobile">
                            Mobile Number <span>*</span>
                        </label>

                        <div class="search-input">

                            <input
                                type="tel"
                                id="mobile"
                                name="mobile"
                                placeholder="Enter Mobile Number"
                                maxlength="10"
                                required>

                            <button type="button" class="search-btn">
                                Search
                            </button>

                        </div>

                    </div>

                </div>

            </section>

            <!-- Patient Details -->

            <section class="form-section">

                <h2>Patient Details</h2>

                <div class="form-row">

                    <div class="form-group">
                        <label for="patientName">Patient Name <span>*</span></label>
                        <input type="text" id="patientName" name="patientName" placeholder="Enter Patient Name" required>
                    </div>

                </div>

                <div class="form-row">

                    <div class="form-group">
                        <label for="age">Age <span>*</span></label>
                        <input type="number" id="age" name="age" placeholder="Age" required>
                    </div>

                    <div class="form-group">
                        <label for="gender">Gender <span>*</span></label>

                        <select id="gender" name="gender" required>
                            <option value="">Select Gender</option>
                            <option>Male</option>
                            <option>Female</option>
                            <option>Other</option>
                        </select>

                    </div>

                </div>

                <div class="form-row">

                    <div class="form-group">

                        <label for="address">Address</label>

                        <textarea
                            id="address"
                            name="address"
                            rows="3"
                            placeholder="Enter Address"></textarea>

                    </div>

                </div>

            </section>

            <!-- Appointment Details -->

            <section class="form-section">

                <h2>Appointment Details</h2>

                <div class="form-row">

                    <div class="form-group">

                        <label for="doctor">Doctor <span>*</span></label>

                        <select id="doctor" name="doctor" required>
                            <option value="">Select Doctor</option>
                        </select>

                    </div>

                    <div class="form-group">

                        <label for="appointmentDate">Date <span>*</span></label>

                        <input
                            type="date"
                            id="appointmentDate"
                            name="appointmentDate"
                            required>

                    </div>

                </div>

                <div class="form-row">

                    <div class="form-group">

                        <label for="timeSlot">Time Slot <span>*</span></label>

                        <select id="timeSlot" name="timeSlot" required>
                            <option value="">Select Available Slot</option>
                        </select>

                    </div>

                </div>

                <div class="form-row">

                    <div class="form-group">

                        <label for="notes">Notes</label>

                        <textarea
                            id="notes"
                            name="notes"
                            rows="3"
                            placeholder="Optional Notes"></textarea>

                    </div>

                </div>

            </section>

            <!-- Buttons -->

            <section class="form-actions">

                <button type="reset" class="secondary-btn">
                    Reset
                </button>

                <button type="submit" class="primary-btn">
                    Book Appointment
                </button>

            </section>

        </form>

    </main>

</div>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
<script src="{{ url_for('static', filename='js/forms.js') }}"></script>
<script src="{{ url_for('static', filename='js/tables.js') }}"></script>
</body>
</html>
